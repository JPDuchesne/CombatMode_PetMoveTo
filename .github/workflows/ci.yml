name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: "5.1"

      - uses: leafo/gh-actions-luarocks@v4

      - name: Install dependencies
        run: luarocks install luaunit --tree lua_modules

      - name: Run tests
        run: ./bin/test
        env:
          LUA: lua

  package:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Package addon
        run: ruby bin/package

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CombatMode_PetMoveTo
          path: dist/*.zip
